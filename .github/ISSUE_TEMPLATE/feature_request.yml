name: Feature request
description: Suggest a new sensor, option, or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: >-
        Describe the feature and the use case. If it needs data the integration
        does not expose today, mention where you see it in the Budget Thuis app.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds tried
      description: Template sensors, automations, or other integrations you tried.
