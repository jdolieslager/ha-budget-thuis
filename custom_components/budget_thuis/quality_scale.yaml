# Tracks Integration Quality Scale rule status. See:
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no custom actions.
  appropriate-polling: done
  brands:
    status: done
    comment: >-
      Bundled under budget_thuis/brand/ per the HA 2026.3 Brands Proxy API
      (see brand/README.md for provenance).
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: >-
      The API client lives in the standalone aiobudgetthuis PyPI package
      (github.com/jdolieslager/aiobudgetthuis), pinned in manifest requirements.
  docs-actions:
    status: exempt
    comment: No custom actions to document.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: done
    comment: >-
      Time-based subscriptions are registered in async_added_to_hass and
      released via async_on_remove.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No custom actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >-
      Account entities report unavailable when their specific endpoint failed
      (per-section available override); full coordinator failures propagate via
      CoordinatorEntity.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      Coordinators log via DataUpdateCoordinator; partial account degradation
      is logged once on change and once on recovery.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud account service; nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: Cloud service without physical devices.
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One fixed service device per config entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: No user-repairable failure modes beyond reauth, which HA surfaces.
  stale-devices:
    status: exempt
    comment: The single service device lives and dies with the config entry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
